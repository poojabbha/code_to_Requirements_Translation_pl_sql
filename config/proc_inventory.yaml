    complexity: "low — single standalone function, one lookup, two
      conditional branches, one exception handler, no cursor"
    call_frequency: "unknown — demo proc, no production data"
    depends_on: []
    business_owner_signoff: null
    target_orm: EntityFramework
    parity_test_result: "6/6 automated tests pass, 0 skipped — see
