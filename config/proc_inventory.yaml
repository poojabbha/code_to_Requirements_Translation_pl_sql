# config/proc_inventory.yaml
#
# One entry per stored proc in scope for migration. This is the durable
# record of migration status — don't track this in chat history or
# memory. Status lifecycle: not_started -> extracted -> validated ->
# migrated -> cutover.
#
# NOTE: All three procs below are demo/dummy procs built to exercise this
# pipeline end to end (no real production PL/SQL codebase available in
# this session) — chosen deliberately to span low/medium/high complexity
# per CLAUDE.md's "mix of simple and complex" requirement. Replace with
# real procs before treating any status/parity result here as meaningful.

procs:
  - name: "PKG_RCC"
    source_path: "reference/procs/pkg_rcc.sql"
    status: extracted
    complexity: "high — row-locking cursor (FOR UPDATE), tiered rate caps
      by tenure/tier, a double-cap on the prorated amount, batch
      idempotency guard via package state, and an exception handler that
      writes to the same log table as the happy path"
    call_frequency: "unknown — demo proc, no production data"
    depends_on: []
    business_owner_signoff: null
    target_orm: EntityFramework
    parity_test_result: not_yet_run
    notes: "Update status/parity_test_result as you actually complete
      Steps 2-9 of the playbook — this entry assumes reverse-engineering
      (requirements/business_rules/technical_spec) is done but code
      generation and parity testing have not been confirmed complete."

  - name: "SP_CALC_LATE_FEE"
